<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #14161F; color: #F1EDE6;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #9AA1B3; margin: 0; }
  .muted { color: #9AA1B3; }
  .card { background: #1D202C; border: 1px solid #2D3242; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 48px; padding: 0 16px; border-radius: 24px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #9AA1B3; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  .drift { animation-name: drift; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline, .drift { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>
<div class="screen" style="position: relative">
  <div class="row" style="gap: 10px; background: #0E2A27; border-bottom: 1px solid
              #1E4A44; min-height: 46px; padding: 0 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3FC0A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4a12.6 12.6 0 0 1 5.6-2.3"/><path d="M14.8 6.3A12.6 12.6 0 0 1 20 8.4"/><path d="M7.2 11.9a8.8 8.8 0 0 1 2.6-1.5"/><path d="M16.8 11.9a8.8 8.8 0 0 0-1.8-1.1"/><path d="M11.9 17.6h.1"/><path d="M4.2 4.2l15.6 15.6"/></svg>
    <span style="flex: 1; font-size: 15px; font-weight: 600; color: #8FE0CF">
      ऑफ़लाइन — सब कुछ चालू है</span>
  </div>

  <div class="flow" style="gap: 13px; padding-top: 4px">
    <div class="row" style="gap: 9px; background: #3A2A14; border: 1px solid #6E4A1C; border-radius: 14px; min-height: 50px; padding: 0 14px" data-tap="counter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2AC5C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.8"/><path d="M12 7.8v4.5l3 1.8"/></svg><div class="col" style="flex: 1; gap: 0"><span style="font-size: 15px; font-weight: 600; color: #F0C48C">मुफ़्त ट्रायल · 18 घंटे 24 मिनट बाकी</span><span style="font-size: 12.5px; color: #D9A468">फिर ₹199 से पास लीजिए</span></div><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F2AC5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 5.8 15.4 12l-5.8 6.2"/></svg></div>

    <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px; padding-bottom: 96px">
      <div class="card col" style="min-height: 48px; padding: 18px 16px; gap: 12px; justify-content: space-between" data-tap="tile"><div style="width: 46px; height: 46px; border-radius: 14px; background: #3A2A14; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2AC5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7.8A4.2 4.2 0 0 1 11.2 8H17"/><path d="M14 4.8 17.4 8 14 11.2"/></svg></div><div class="col" style="gap: 4px"><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 25px; font-weight: 600; line-height: 1.1">रास्ता</span><span class="muted" style="font-size: 13.5px; line-height: 1.35">कहाँ जाना है?</span></div></div> <div class="card col" style="min-height: 48px; padding: 18px 16px; gap: 12px; justify-content: space-between" data-tap="tile"><div style="width: 46px; height: 46px; border-radius: 14px; background: #3A2A14; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2AC5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2h16"/><path d="M5.2 11.2a6.8 6.8 0 0 0 13.6 0"/><path d="M12 4.2c1.5 1 1.5 2.5 0 3.5"/></svg></div><div class="col" style="gap: 4px"><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 25px; font-weight: 600; line-height: 1.1">खाना</span><span class="muted" style="font-size: 13.5px; line-height: 1.35">वेज · जैन · आस-पास</span></div></div> <div class="card col" style="min-height: 48px; padding: 18px 16px; gap: 12px; justify-content: space-between" data-tap="tile"><div style="width: 46px; height: 46px; border-radius: 14px; background: #3A2A14; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2AC5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.4-3.6 6.2-8 6.2a9.9 9.9 0 0 1-2.5-.3L5.2 19.8l1-3A6 6 0 0 1 4 12.2C4 8.8 7.6 6 12 6s8 2.8 8 6.2Z"/></svg></div><div class="col" style="gap: 4px"><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 25px; font-weight: 600; line-height: 1.1">बोलना</span><span class="muted" style="font-size: 13.5px; line-height: 1.35">हिंदी बोलिए, अरबी दिखाइए</span></div></div> <div class="card col" style="min-height: 48px; padding: 18px 16px; gap: 12px; justify-content: space-between" data-tap="tile"><div style="width: 46px; height: 46px; border-radius: 14px; background: #371713; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E24B3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2 5.2 6.7v5.4c0 3.5 2.8 6.2 6.8 7.7 4-1.5 6.8-4.2 6.8-7.7V6.7L12 4.2Z"/><path d="M12 9.4v5"/><path d="M9.5 11.9h5"/></svg></div><div class="col" style="gap: 4px"><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 25px; font-weight: 600; line-height: 1.1">मदद</span><span class="muted" style="font-size: 13.5px; line-height: 1.35">पुलिस · अस्पताल · होटल</span></div></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex;
              flex-direction: column; align-items: center; gap: 7px">
    <div style="border-radius: 33px; padding: 2.5px; background: linear-gradient(140deg, #FBD9A4, #E8871E 42%, #B4610F); box-shadow: 0 0 0 1px rgba(232, 135, 30, 0.20), 0 10px 30px rgba(232, 135, 30, 0.30), 0 0 46px rgba(232, 135, 30, 0.22)"><div style="border-radius: 31.5px; background: #F0913A; overflow: hidden"><div style="width: 62px; height: 62px; border-radius: 31px; background: #F0913A; display: flex; align-items: center; justify-content: center" data-tap="mic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1C1206" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.8 2.8 0 0 1 2.8 2.8v4a2.8 2.8 0 0 1-5.6 0v-4A2.8 2.8 0 0 1 12 4.5Z"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.8v2.7"/></svg></div></div></div>
    <span class="muted" style="font-size: 13.5px">
      बोलकर पूछिए — “करामा कैसे जाऊँ?”</span>
  </div>
</div>
</x-dc>
</body>
</html>
