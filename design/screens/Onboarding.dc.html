<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #F7F3EC; color: #141826;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #5B6070; margin: 0; }
  .muted { color: #5B6070; }
  .card { background: #FFFDF9; border: 1px solid #E6DED2; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 38px; padding: 0 14px; border-radius: 19px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #5B6070; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  .drift { animation-name: drift; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline, .drift { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>
<div class="screen">
  <div class="flow" style="gap: 18px; padding-top: 44px">
    <div class="col" style="gap: 8px">
      <div class="row" style="gap: 10px">
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #1A2456;
                    display: flex; align-items: center; justify-content: center;
                    font-family: 'Anek Devanagari', sans-serif; color: #E8871E;
                    font-size: 24px; font-weight: 700">सा</div>
        <span style="font-family: 'Anek Devanagari', sans-serif; font-size: 30px;
                     font-weight: 700; letter-spacing: -0.01em">दुबई साथी</span>
      </div>
      <p style="margin: 0; font-family: 'Anek Devanagari', sans-serif; font-size: 21px;
                font-weight: 500; color: #1A2456; line-height: 1.35">
        दुबई. आपकी भाषा में. ऑफ़लाइन.</p>
    </div>

    <div class="card" style="padding: 18px 16px">
      <div class="row" style="justify-content: space-between; margin-bottom: 14px">
        <span class="t2">दुबई पैक</span>
        <span class="muted" style="font-size: 14px">84 MB</span>
      </div>
      <div class="col" style="gap: 14px">
        <div class="row" style="align-items: flex-start; gap: 12px"><div style="width: 26px; height: 26px; border-radius: 13px; background: #E1F2EF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 12.6 9.6 17 18.8 7.2"/></svg></div><div class="col" style="flex: 1; gap: 1px"><div class="row" style="justify-content: space-between"><span style="font-size: 16px; font-weight: 500">नक्शा</span><span class="muted" style="font-size: 14px">31 MB</span></div></div></div> <div class="row" style="align-items: flex-start; gap: 12px"><div style="width: 26px; height: 26px; border-radius: 13px; background: #E1F2EF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 12.6 9.6 17 18.8 7.2"/></svg></div><div class="col" style="flex: 1; gap: 1px"><div class="row" style="justify-content: space-between"><span style="font-size: 16px; font-weight: 500">मेट्रो, ट्राम, बस</span><span class="muted" style="font-size: 14px">4 MB</span></div></div></div> <div class="row" style="align-items: flex-start; gap: 12px"><div style="width: 26px; height: 26px; border-radius: 13px; background: #E1F2EF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 12.6 9.6 17 18.8 7.2"/></svg></div><div class="col" style="flex: 1; gap: 1px"><div class="row" style="justify-content: space-between"><span style="font-size: 16px; font-weight: 500">खाना और ज़रूरी वाक्य</span><span class="muted" style="font-size: 14px">9 MB</span></div></div></div> <div class="row" style="align-items: flex-start; gap: 12px"><div style="width: 26px; height: 26px; border-radius: 13px; background: #E1F2EF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2v10"/><path d="M8 10.4 12 14.4l4-4"/><path d="M5 19.2h14"/></svg></div><div class="col" style="flex: 1; gap: 1px"><div class="row" style="justify-content: space-between"><span style="font-size: 16px; font-weight: 500">हिंदी आवाज़</span><span class="muted" style="font-size: 14px">62%</span></div><div style="height: 5px; border-radius: 3px; background: #E6DED2; margin-top: 7px"><div style="width: 62%; height: 5px; border-radius: 3px; background: #1A2456"></div></div></div></div>
      </div>
    </div>

    <div class="row" style="gap: 10px">
      <div style="flex: 1"><div class="btn" style="background: transparent; color: #1A2456; border: 1.25px solid #5B6070;"><span>डाउनलोड रोकें</span></div></div>
    </div>

    <div class="col" style="gap: 10px; background: #ECE6DB; border: 1px solid #E6DED2;
                            border-radius: 18px; padding: 18px">
      <div class="row" style="gap: 8px; color: #5B6070"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4a12.6 12.6 0 0 1 5.6-2.3"/><path d="M14.8 6.3A12.6 12.6 0 0 1 20 8.4"/><path d="M7.2 11.9a8.8 8.8 0 0 1 2.6-1.5"/><path d="M16.8 11.9a8.8 8.8 0 0 0-1.8-1.1"/><path d="M11.9 17.6h.1"/><path d="M4.2 4.2l15.6 15.6"/></svg>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.03em">आगे यह आएगा</span>
      </div>
      <p style="margin: 0; font-family: 'Anek Devanagari', sans-serif; font-size: 20px;
                font-weight: 600; line-height: 1.3; color: #5B6070">
        डाउनलोड पूरा होने पर — इंटरनेट बंद करके आज़मा सकेंगे.</p>
    </div>

    <p class="muted" style="margin: 0; font-size: 14px; text-align: center">
      शुरू करने के लिए अकाउंट ज़रूरी नहीं</p>
  </div>
</div>
</x-dc>
</body>
</html>
