<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #F7F3EC; color: #141826;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #5B6070; margin: 0; }
  .muted { color: #5B6070; }
  .card { background: #FFFDF9; border: 1px solid #E6DED2; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 48px; padding: 0 16px; border-radius: 24px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #5B6070; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  .drift { animation-name: drift; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline, .drift { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>
<div class="screen">
  <div class="row" style="gap: 6px; padding: 14px 16px 10px; align-items: center"><div style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center" data-tap="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 5.8 8.6 12l5.8 6.2"/></svg></div><div class="col" style="flex: 1; gap: 2px; min-width: 0"><div class="row" style="gap: 5px; color: #9A5B10"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A5B10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2h16"/><path d="M5.2 11.2a6.8 6.8 0 0 0 13.6 0"/><path d="M12 4.2c1.5 1 1.5 2.5 0 3.5"/></svg><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.02em">खाना</span><span style="font-size: 13px; color: #8A8F9E">›</span><span style="font-size: 13px; font-weight: 600; color: #5B6070">जगह</span></div><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">चप्पन भोग</span></div><div style="width: 48px; height: 48px; margin-right: -10px; display: flex; align-items: center; justify-content: center" data-tap="home"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1A2456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg></div></div>
  <div class="flow">
    <div class="col" style="gap: 9px">
      <span class="muted" style="font-size: 15px">गुजराती थाली · करामा</span>
      <div class="row" style="gap: 6px"><span style="background: #E1F2EF; color: #0B7A6B; border-radius: 8px; padding: 2px 8px; font-size: 12.5px; font-weight: 600">वेज</span> <span style="background: #E1F2EF; color: #0B7A6B; border-radius: 8px; padding: 2px 8px; font-size: 12.5px; font-weight: 600">जैन</span> <span style="background: #E1F2EF; color: #0B7A6B; border-radius: 8px; padding: 2px 8px; font-size: 12.5px; font-weight: 600">बिना प्याज़/लहसुन</span></div>
    </div>

    <div class="card row" style="padding: 0">
      <div class="col" style="flex: 1; align-items: center; gap: 2px; padding: 13px 6px">
        <span style="font-size: 16px; font-weight: 600">700 मी</span>
        <span class="muted" style="font-size: 13px">करामा से</span></div>
      <div style="width: 1px; align-self: stretch; background: #E6DED2"></div>
      <div class="col" style="flex: 1; align-items: center; gap: 2px; padding: 13px 6px">
        <span style="font-size: 16px; font-weight: 600">AED 30–45</span>
        <span class="muted" style="font-size: 13px">एक के लिए</span></div>
      <div style="width: 1px; align-self: stretch; background: #E6DED2"></div>
      <div class="col" style="flex: 1; align-items: center; gap: 2px; padding: 13px 6px">
        <span style="font-size: 16px; font-weight: 600">11:30–23:00</span>
        <span class="muted" style="font-size: 13px">खुला</span></div>
    </div>

    <div class="col" style="gap: 9px">
      <p class="lbl">मेन्यू</p>
      <div class="row" style="gap: 9px"><div style="flex: 1; height: 92px; border-radius: 12px; background: #EFE8DB; border: 1px solid #E6DED2; display: flex; align-items: center; justify-content: center; color: #5B6070; font-size: 12.5px; font-weight: 600">मेन्यू फ़ोटो</div><div style="flex: 1; height: 92px; border-radius: 12px; background: #EFE8DB; border: 1px solid #E6DED2; display: flex; align-items: center; justify-content: center; color: #5B6070; font-size: 12.5px; font-weight: 600">मेन्यू फ़ोटो</div><div style="flex: 1; height: 92px; border-radius: 12px; background: #EFE8DB; border: 1px solid #E6DED2; display: flex; align-items: center; justify-content: center; color: #5B6070; font-size: 12.5px; font-weight: 600">मेन्यू फ़ोटो</div></div>
    </div>

    <div class="card row" style="padding: 13px 15px; gap: 11px; align-items: flex-start;
                                 background: #FDF0DC; border-color: #F2C795">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A5B10" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.4-3.6 6.2-8 6.2a9.9 9.9 0 0 1-2.5-.3L5.2 19.8l1-3A6 6 0 0 1 4 12.2C4 8.8 7.6 6 12 6s8 2.8 8 6.2Z"/></svg>
      <span style="font-size: 14.5px; color: #7A4A0C; flex: 1; line-height: 1.45">
        जैन थाली अलग बनती है — ऑर्डर करते समय बता दें. ज़रूरी वाक्य तैयार है.</span>
    </div>

    <div style="flex: 1"></div>
    <div class="row" style="gap: 10px; padding-bottom: 16px">
      <div style="flex: 1"><div class="btn" style="min-height: 54px; background: #E8871E; color: #231403;" data-tap="button"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7.8A4.2 4.2 0 0 1 11.2 8H17"/><path d="M14 4.8 17.4 8 14 11.2"/></svg><span>कैसे पहुँचें</span></div></div>
      <div style="width: 96px"><div class="btn" style="min-height: 54px; background: transparent; color: #1A2456; border: 1.25px solid #5B6070;" data-tap="button"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 4.6h3.2l1.5 3.9-2.1 1.5a9.2 9.2 0 0 0 4.8 4.8l1.5-2.1 3.9 1.5v3.2c0 1-.9 1.8-1.9 1.7C11.2 18.9 5.1 12.8 4.9 6.5 4.8 5.5 5.6 4.6 6.6 4.6Z"/></svg><span>फ़ोन</span></div></div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E6DED2; background: #FFFDF9; padding: 9px 6px 14px"><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg><span style="color: #5B6070">घर</span></div><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7.8A4.2 4.2 0 0 1 11.2 8H17"/><path d="M14 4.8 17.4 8 14 11.2"/></svg><span style="color: #5B6070">रास्ता</span></div><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.4-3.6 6.2-8 6.2a9.9 9.9 0 0 1-2.5-.3L5.2 19.8l1-3A6 6 0 0 1 4 12.2C4 8.8 7.6 6 12 6s8 2.8 8 6.2Z"/></svg><span style="color: #5B6070">बोलना</span></div><div class="tab" style="min-height: 48px; color: #C62B2B" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2 5.2 6.7v5.4c0 3.5 2.8 6.2 6.8 7.7 4-1.5 6.8-4.2 6.8-7.7V6.7L12 4.2Z"/><path d="M12 9.4v5"/><path d="M9.5 11.9h5"/></svg><span style="color: #5B6070">मदद</span></div></div>
</div>
</x-dc>
</body>
</html>
