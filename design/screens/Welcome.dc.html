<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #F7F3EC; color: #141826;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #5B6070; margin: 0; }
  .muted { color: #5B6070; }
  .card { background: #FFFDF9; border: 1px solid #E6DED2; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 38px; padding: 0 14px; border-radius: 19px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
            border-top: 1px solid #E6DED2; background: #FFFDF9; padding: 9px 4px 14px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #5B6070; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>
<div class="screen" style="background: #0F1530; color: #F7F3EC;
            position: relative; overflow: hidden">

  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0;
       pointer-events: none" aria-hidden="true">
    <defs>
      <radialGradient id="dusk" cx="50%" cy="76%" r="58%">
        <stop offset="0%" stop-color="#E8871E" stop-opacity="0.34"/>
        <stop offset="55%" stop-color="#8A4A1E" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#0F1530" stop-opacity="0"/>
      </radialGradient>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9"
        numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    <ellipse class="glow" cx="195" cy="642" rx="230" ry="190" fill="url(#dusk)"/>
    <rect width="390" height="844" filter="url(#grain)" opacity="0.045"/>
  </svg>

  <div style="position: absolute; left: 0; right: 0; bottom: 208px" class="skyline">
    <svg width="390" height="260" viewBox="0 0 390 260" aria-hidden="true">
      <circle cx="195" cy="196" r="58" fill="#E8871E" opacity="0.2"/>
      <circle cx="195" cy="196" r="34" fill="#E8871E" opacity="0.28"/>
      <rect x="14" y="132" width="26" height="108" rx="3" fill="#0A0F24"/><rect x="48" y="100" width="20" height="140" rx="3" fill="#0A0F24"/><rect x="76" y="150" width="30" height="90" rx="3" fill="#0A0F24"/><rect x="176" y="112" width="22" height="128" rx="3" fill="#0A0F24"/><rect x="206" y="146" width="26" height="94" rx="3" fill="#0A0F24"/><rect x="248" y="96" width="18" height="144" rx="3" fill="#0A0F24"/><rect x="272" y="136" width="30" height="104" rx="3" fill="#0A0F24"/><rect x="310" y="118" width="20" height="122" rx="3" fill="#0A0F24"/><rect x="336" y="158" width="34" height="82" rx="3" fill="#0A0F24"/> <path d="M132 240 L140 44 L148 240 Z" fill="#0A0F24"/><path d="M140 44 L140 20" stroke="#0A0F24" stroke-width="2.4"/> <rect x="54" y="122" width="3" height="4" rx="1" fill="#E8871E" opacity="0.55"/><rect x="54" y="138" width="3" height="4" rx="1" fill="#E8871E" opacity="0.3"/><rect x="60" y="130" width="3" height="4" rx="1" fill="#E8871E" opacity="0.45"/><rect x="182" y="132" width="3" height="4" rx="1" fill="#E8871E" opacity="0.5"/><rect x="188" y="150" width="3" height="4" rx="1" fill="#E8871E" opacity="0.32"/><rect x="254" y="118" width="3" height="4" rx="1" fill="#E8871E" opacity="0.5"/><rect x="254" y="136" width="3" height="4" rx="1" fill="#E8871E" opacity="0.28"/><rect x="260" y="128" width="3" height="4" rx="1" fill="#E8871E" opacity="0.42"/><rect x="316" y="140" width="3" height="4" rx="1" fill="#E8871E" opacity="0.45"/><rect x="322" y="158" width="3" height="4" rx="1" fill="#E8871E" opacity="0.3"/><rect x="20" y="152" width="3" height="4" rx="1" fill="#E8871E" opacity="0.4"/><rect x="30" y="168" width="3" height="4" rx="1" fill="#E8871E" opacity="0.28"/>
      <rect x="0" y="238" width="390" height="22" fill="#0A0F24"/>
    </svg>
  </div>

  <div style="position: relative; flex: 1; display: flex; flex-direction: column;
              padding: 0 24px">
    <div class="row rise d1" style="padding-top: 30px">
      <div class="row" style="gap: 7px; background: rgba(247, 243, 236, 0.1);
                  border-radius: 17px; height: 34px; padding: 0 13px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E8871E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4a12.6 12.6 0 0 1 5.6-2.3"/><path d="M14.8 6.3A12.6 12.6 0 0 1 20 8.4"/><path d="M7.2 11.9a8.8 8.8 0 0 1 2.6-1.5"/><path d="M16.8 11.9a8.8 8.8 0 0 0-1.8-1.1"/><path d="M11.9 17.6h.1"/><path d="M4.2 4.2l15.6 15.6"/></svg>
        <span style="font-size: 13.5px; font-weight: 600">बिना इंटरनेट चलता है</span>
      </div>
    </div>

    <div class="col" style="gap: 15px; margin-top: 54px">
      <div class="row rise d2" style="gap: 12px">
        <div style="width: 50px; height: 50px; border-radius: 15px; background: #E8871E;
                    display: flex; align-items: center; justify-content: center;
                    font-family: 'Anek Devanagari', sans-serif; color: #231403;
                    font-size: 28px; font-weight: 700;
                    box-shadow: 0 10px 30px rgba(232, 135, 30, 0.35)">सा</div>
      </div>
      <h1 class="rise d3" style="margin: 0; font-family: 'Anek Devanagari', sans-serif;
             font-size: 52px; font-weight: 700; line-height: 1.02;
             letter-spacing: -0.025em">दुबई<br>साथी</h1>
      <p class="rise d4" style="margin: 0; font-family: 'Anek Devanagari', sans-serif;
            font-size: 23px; font-weight: 500; line-height: 1.35; color: #E8871E">
        दुबई. आपकी भाषा में.<br>ऑफ़लाइन.</p>
    </div>

    <div style="flex: 1"></div>

    <div class="col rise d5" style="gap: 15px; padding-bottom: 32px">
      <p style="margin: 0; font-size: 16px; line-height: 1.5;
                color: rgba(247, 243, 236, 0.74)">
        रास्ता, खाना और बोलना — तीनों आपके फ़ोन में,<br>बिना नेटवर्क, बिना रोमिंग.</p>
      <div class="btn" style="background: #E8871E; color: #231403; min-height: 58px;
                  font-size: 18px; box-shadow: 0 12px 34px rgba(232, 135, 30, 0.3)">
        शुरू करें</div>
      <span style="font-size: 13.5px; text-align: center;
                   color: rgba(247, 243, 236, 0.52)">अकाउंट ज़रूरी नहीं</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
