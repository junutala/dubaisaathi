<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #F7F3EC; color: #141826;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #5B6070; margin: 0; }
  .muted { color: #5B6070; }
  .card { background: #FFFDF9; border: 1px solid #E6DED2; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 48px; padding: 0 16px; border-radius: 24px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #5B6070; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  .drift { animation-name: drift; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline, .drift { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>

  <div class="row" style="gap: 6px; padding: 14px 16px 10px; align-items: center"><div style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center" data-tap="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 5.8 8.6 12l5.8 6.2"/></svg></div><div class="col" style="flex: 1; gap: 2px; min-width: 0"><div class="row" style="gap: 5px; color: #1A2456"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A2456" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.02em">घर</span><span style="font-size: 13px; color: #8A8F9E">›</span><span style="font-size: 13px; font-weight: 600; color: #5B6070">पास</span></div><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">पास चालू</span></div><div style="width: 48px; height: 48px; margin-right: -10px; display: flex; align-items: center; justify-content: center" data-tap="home"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1A2456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg></div></div>
  <div class="flow" style="gap: 18px; justify-content: center">
    <div class="col" style="align-items: center; gap: 14px">
      <div style="width: 76px; height: 76px; border-radius: 38px; background: #0B7A6B;
                  display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 12.6 9.6 17 18.8 7.2"/></svg></div>
      <div class="col" style="align-items: center; gap: 6px">
        <span style="font-family: 'Anek Devanagari', sans-serif; font-size: 30px;
                     font-weight: 600">पास चालू हो गया</span>
        <span style="font-size: 16px; color: #5B6070; text-align: center; line-height: 1.45">
          4 डिवाइस · ₹499<br>19 सितंबर तक चलेगा</span>
      </div>
    </div>
  </div>
  <div class="col" style="gap: 10px; padding: 0 20px 24px">
    <div class="btn" style="min-height: 54px; background: #E8871E; color: #231403;" data-tap="button"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.2v11.6"/><path d="M6.2 12h11.6"/></svg><span>बाक़ी डिवाइस जोड़ें</span></div>
    <div class="btn" style="min-height: 54px; background: transparent; color: #1A2456; border: 1.25px solid #5B6070;" data-tap="button"><span>अभी नहीं</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
