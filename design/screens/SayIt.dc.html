<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mukta', 'Segoe UI', system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: #B96A12; text-decoration: none; }
  a:hover { color: #8F5009; }
  .screen { width: 390px; height: 844px; background: #F7F3EC; color: #141826;
            display: flex; flex-direction: column; overflow: hidden; }
  .flow { flex: 1; display: flex; flex-direction: column; gap: 14px;
          padding: 0 20px; overflow: hidden; }
  .hdr { display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px; }
  .t1 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .t2 { font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 600;
        font-size: 19px; line-height: 1.2; margin: 0; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: #5B6070; margin: 0; }
  .muted { color: #5B6070; }
  .card { background: #FFFDF9; border: 1px solid #E6DED2; border-radius: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .btn { min-height: 54px; border-radius: 14px; display: flex; align-items: center;
         justify-content: center; gap: 10px; font-weight: 600; font-size: 17px;
         font-family: 'Mukta', sans-serif; }
  .chip { height: 48px; padding: 0 16px; border-radius: 24px; display: flex;
          align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
          white-space: nowrap; }
  .ar { font-family: 'Noto Naskh Arabic', 'Mukta', serif; direction: rtl;
        line-height: 1.6; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px;
         font-size: 12px; font-weight: 600; color: #5B6070; min-height: 48px;
         justify-content: center; }

  /* Motion is transform/opacity only: GPU-composited, a few hundred bytes of CSS, and no
     asset to download. Anything heavier than this does not belong in an offline app. */
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); }
                    to   { opacity: 1; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 0.5; transform: scale(1); }
                    50%      { opacity: 0.9; transform: scale(1.06); } }
  @keyframes skyline { from { opacity: 0; transform: translate3d(0, 40px, 0); }
                       to   { opacity: 1; transform: none; } }
  .rise { animation: rise 900ms cubic-bezier(0.16, 0.84, 0.28, 1) both; }
  .d1 { animation-delay: 80ms; }  .d2 { animation-delay: 220ms; }
  .d3 { animation-delay: 360ms; } .d4 { animation-delay: 500ms; }
  .d5 { animation-delay: 660ms; }
  .glow { animation: glow 5.5s ease-in-out 1.2s infinite; }
  .skyline { animation: skyline 1400ms cubic-bezier(0.16, 0.84, 0.28, 1) 160ms both; }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  .drift { animation-name: drift; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .glow, .skyline, .drift { animation: none; opacity: 1; transform: none; }
  }
</style>
</helmet>
<div class="screen"><div class="row" style="gap: 12px; min-height: 48px; padding: 0 6px 0 16px; background: #FFFDF9; border-bottom: 1px solid #E6DED2"><div class="row" style="gap: 5px; color: #0B7A6B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4a12.6 12.6 0 0 1 5.6-2.3"/><path d="M14.8 6.3A12.6 12.6 0 0 1 20 8.4"/><path d="M7.2 11.9a8.8 8.8 0 0 1 2.6-1.5"/><path d="M16.8 11.9a8.8 8.8 0 0 0-1.8-1.1"/><path d="M11.9 17.6h.1"/><path d="M4.2 4.2l15.6 15.6"/></svg><span style="font-size: 13px; font-weight: 700">ऑफ़लाइन</span></div><div class="col" style="flex: 1; gap: 4px; min-height: 48px; justify-content: center" data-tap="validity"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">18 घंटे बाकी</span><div style="height: 4px; border-radius: 2px; background: #E6DED2"><div style="width: 76%; height: 4px; border-radius: 2px; background: #E8871E"></div></div></div><div class="row" style="min-height: 48px; padding: 0 12px; gap: 5px; border-radius: 14px; background: #E8871E; color: #231403; font-size: 13.5px; font-weight: 700" data-tap="recharge">रिचार्ज</div><div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center" data-tap="theme"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.2 14.6A7.6 7.6 0 0 1 9.4 4.8a7.6 7.6 0 1 0 9.8 9.8Z"/></svg></div></div>
  <div class="row" style="gap: 6px; padding: 14px 16px 10px; align-items: center"><div style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center" data-tap="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 5.8 8.6 12l5.8 6.2"/></svg></div><div class="col" style="flex: 1; gap: 2px; min-width: 0"><div class="row" style="gap: 5px; color: #9A5B10"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A5B10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.4-3.6 6.2-8 6.2a9.9 9.9 0 0 1-2.5-.3L5.2 19.8l1-3A6 6 0 0 1 4 12.2C4 8.8 7.6 6 12 6s8 2.8 8 6.2Z"/></svg><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.02em">बोलना</span><span style="font-size: 13px; color: #8A8F9E">›</span><span style="font-size: 13px; font-weight: 600; color: #5B6070">क्या कहना है? › अरबी में</span></div><span style="font-family: 'Anek Devanagari', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">अरबी में</span></div><div style="width: 48px; height: 48px; margin-right: -10px; display: flex; align-items: center; justify-content: center" data-tap="home"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1A2456" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg></div></div>
  <div class="flow">
    <div class="col" style="gap: 7px">
      <p class="lbl">आपने कहा</p>
      <div class="card row" style="padding: 14px 15px; gap: 10px">
        <span style="flex: 1; font-size: 17px; line-height: 1.4">
          इस होटल तक ले चलो, कितना लगेगा?</span>
      </div>
    </div>

    <div class="col" style="gap: 7px">
      <p class="lbl">ड्राइवर को यह दिखाएँ</p>
      <div class="col" style="gap: 14px; background: #1A2456; border-radius: 18px;
                              padding: 22px 20px; color: #F7F3EC">
        <p class="ar" style="margin: 0; font-size: 34px; font-weight: 400; line-height: 1.55">
          خذني إلى هذا الفندق، كم الأجرة؟</p>
      </div>
    </div>

    <div class="row" style="gap: 10px">
      <div style="flex: 1"><div class="btn" style="min-height: 54px; background: transparent; color: #1A2456; border: 1.25px solid #5B6070;" data-tap="button"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h3l4 3.4V6.6L8 10H5Z"/><path d="M15.4 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.9 7.2a6.8 6.8 0 0 1 0 9.6"/></svg><span>अरबी में सुनाएँ</span></div></div>
    </div>

    <div style="flex: 1"></div>
    <div class="col" style="gap: 10px; padding-bottom: 16px">
      <div class="btn" style="min-height: 54px; background: #E8871E; color: #231403;" data-tap="button"><span>ड्राइवर को दिखाएँ</span></div>
    </div>
  </div>
  <div class="row" style="border-top: 1px solid #E6DED2; background: #FFFDF9; padding: 9px 6px 14px; align-items: flex-end; justify-content: space-between"><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4.2l8 6.4"/><path d="M6.2 9.8v9.9h11.6V9.8"/></svg><span style="color: #5B6070">घर</span></div><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20v-7.8A4.2 4.2 0 0 1 11.2 8H17"/><path d="M14 4.8 17.4 8 14 11.2"/></svg><span style="color: #5B6070">रास्ता</span></div><div style="width: 62px; height: 62px; display: flex; justify-content: center; margin-top: -26px"><div style="border-radius: 29px; padding: 2.5px; background: linear-gradient(140deg, #FBD9A4, #E8871E 42%, #B4610F); box-shadow: 0 0 0 1px rgba(232, 135, 30, 0.20), 0 10px 30px rgba(232, 135, 30, 0.30), 0 0 46px rgba(232, 135, 30, 0.22)"><div style="border-radius: 27.5px; background: #E8871E; overflow: hidden"><div style="width: 54px; height: 54px; border-radius: 27px; background: #E8871E; display: flex; align-items: center; justify-content: center" data-tap="mic"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#231403" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.8 2.8 0 0 1 2.8 2.8v4a2.8 2.8 0 0 1-5.6 0v-4A2.8 2.8 0 0 1 12 4.5Z"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.8v2.7"/></svg></div></div></div></div><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2h16"/><path d="M5.2 11.2a6.8 6.8 0 0 0 13.6 0"/><path d="M12 4.2c1.5 1 1.5 2.5 0 3.5"/></svg><span style="color: #5B6070">खाना</span></div><div class="tab" style="min-height: 48px; color: #5B6070" data-tap="nav"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.6"/><circle cx="8.6" cy="10.6" r="1.9"/><path d="M5.8 15.6c.6-1.4 1.6-2.1 2.8-2.1s2.2.7 2.8 2.1"/><path d="M13.6 9.6h4.2"/><path d="M13.6 13.2h4.2"/></svg><span style="color: #5B6070">ज़रूरी जानकारी</span></div></div>
</div>
