# Headers a PWA actually depends on. Getting these wrong does not break the first visit — it
# breaks the second one, which is worse, because a stale service worker can pin a traveller to
# an old build for the length of their trip.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Railway terminates TLS at its edge and forwards the original scheme. A visitor who types the
    # bare hostname reaches http, where the browser refuses geolocation, the camera, the microphone
    # and the service worker — so the offline app silently becomes a broken online one. Send them to
    # https before anything else runs. Only an explicit "http" redirects, so a request arriving
    # without the header (an internal health check) is left alone and this cannot loop.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    # woff2 is already compressed; gzipping it costs CPU and saves nothing.

    # Hashed by Vite, so the name changes whenever the bytes do. Safe to cache forever, and this
    # is what makes a repeat visit free even before the service worker takes over.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker MUST be revalidated on every visit. Cache it and a traveller can be
    # stuck on an old build until the browser decides otherwise — which may be days.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        types { } default_type application/javascript;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
        types { } default_type application/javascript;
    }
    # Workbox's runtime is hashed like any asset, so it is matched by shape, not by a literal
    # name that a rebuild would change out from under this file.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The beacon: sixty bytes saying which build this server is serving. It is the one thing the
    # app compares against what it is actually running, so a cached copy of it would answer the
    # question with the answer from last week. no-store, not no-cache.
    location = /version.json {
        add_header Cache-Control "no-store";
        types { } default_type application/json;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # The card reader's engine (decision 032): the worker, the cores and the English, versioned in
    # their path and so cacheable for ever. Only a file that exists answers — the shell's
    # index.html fallback must never answer for a script, the way it once answered for /sw.js.
    # The policy and the two other headers are repeated because this block sets a header of
    # its own, and nginx drops every server-level one when a location does that.
    location /ocr/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # नक्शा's street map (decision 035): the archive, its glyphs and sprites, versioned in the path.
    # Only a file that exists answers — an index.html fallback would hand MapLibre a web page for a
    # tile archive. `files.json` is what the phone asks to learn what to download, so it is never
    # cached; the rest is immutable. Range requests are nginx's default for static files, which is
    # how the archive is read from here while it is still downloading.
    location = /map/v1/files.json {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        types { } default_type application/json;
        try_files $uri =404;
    }
    location /map/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        types {
            application/octet-stream pmtiles;
            application/x-protobuf pbf;
            application/json json;
            image/png png;
        }
        try_files $uri =404;
    }

    # The shell. Never cached, because it names the hashed assets.
    location / {
        add_header Cache-Control "no-cache";
        # Hash routing means every screen is this one file, so a refresh deep in the app works.
        try_files $uri $uri/ /index.html;
    }

    # The app asks nothing of any other origin (rule 1), so it is told it may not. This is the
    # cheap half of a defence against a compromised dependency phoning home: scripts, styles,
    # fonts and images from here only, and connections to Supabase for the one moment the app
    # needs a server. frame-ancestors 'none' because nothing should embed a payment screen.
    # No workers from blobs. WebAssembly is allowed for one reason, the card reader on घर.1
    # (decision 032): `'wasm-unsafe-eval'` lets the page compile wasm and nothing else — it is not
    # `'unsafe-eval'`, and no JavaScript string can be run with it. `media-src blob:` is बोलना's own
    # recording played back by the browser, never a fetched file (decision 020).
    #
    # Held in a variable because a location that sets any header of its own drops every
    # server-level `add_header` — /ocr/ above repeats it on purpose, and must go on repeating it.
    #
    # Razorpay is named three times because Checkout is three things: a script we load only when
    # a traveller taps buy, an iframe it opens for the bank, and its own calls home. Leave any
    # one of them out and the buy button fails with nothing in the console a traveller can see.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.razorpay.com; media-src 'self' blob:; connect-src 'self' https://pixlnjmpksmfqheotinp.supabase.co https://*.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://*.razorpay.com; child-src https://api.razorpay.com https://*.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Location, the camera and — since decision 020 — the microphone, from this origin only.
    # `microphone=()` used to be true and is now a lie that no browser will let बोलना argue with:
    # this header refuses the microphone before the phone is ever asked, so the screen would have
    # reported a refusal the traveller could do nothing about. The one rule this project keeps
    # above all others is that we never tell a phone it cannot do something until it has said so.
    add_header Permissions-Policy "microphone=(self), geolocation=(self), camera=(self)" always;
}
