# Headers a PWA actually depends on. Getting these wrong does not break the first visit — it
# breaks the second one, which is worse, because a stale service worker can pin a traveller to
# an old build for the length of their trip.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Railway terminates TLS at its edge and forwards the original scheme. A visitor who types the
    # bare hostname reaches http, where the browser refuses geolocation, the camera, the microphone
    # and the service worker — so the offline app silently becomes a broken online one. Send them to
    # https before anything else runs. Only an explicit "http" redirects, so a request arriving
    # without the header (an internal health check) is left alone and this cannot loop.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    # woff2 is already compressed; gzipping it costs CPU and saves nothing.

    # Hashed by Vite, so the name changes whenever the bytes do. Safe to cache forever, and this
    # is what makes a repeat visit free even before the service worker takes over.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker MUST be revalidated on every visit. Cache it and a traveller can be
    # stuck on an old build until the browser decides otherwise — which may be days.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        types { } default_type application/javascript;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
        types { } default_type application/javascript;
    }
    # Workbox's runtime is hashed like any asset, so it is matched by shape, not by a literal
    # name that a rebuild would change out from under this file.
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # The shell. Never cached, because it names the hashed assets.
    location / {
        add_header Cache-Control "no-cache";
        # Hash routing means every screen is this one file, so a refresh deep in the app works.
        try_files $uri $uri/ /index.html;
    }

    # The app asks nothing of any other origin (rule 1), so it is told it may not. This is the
    # cheap half of a defence against a compromised dependency phoning home: scripts, styles,
    # fonts and images from here only, and connections to Supabase for the one moment the app
    # needs a server. frame-ancestors 'none' because nothing should embed a payment screen.
    # No WebAssembly, no workers from blobs and no media: the speech engine that needed all three
    # is gone (16 September), so the policy is back to the shape a static app deserves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://pixlnjmpksmfqheotinp.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Location and the camera, from this origin only. No microphone: there is none in the app.
    add_header Permissions-Policy "microphone=(), geolocation=(self), camera=(self)" always;
}
