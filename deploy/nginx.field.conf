server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Railway terminates TLS at its edge and forwards the original scheme. A collector who types the
  # bare hostname reaches http, where the browser refuses geolocation and the camera — which are
  # the two required fields on the form, so the whole tool quietly stops working while still
  # looking fine. Send them to https before anything else runs. Only an explicit "http" redirects,
  # so a request arriving without the header (an internal health check) is left alone.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # nginx drops every inherited `add_header` in a block that sets one of its own, so the common
  # headers are repeated per location rather than set once on the server. Setting them here only
  # would mean they apply to no request at all, since every request matches a location below.

  # A single-page app with no service worker: every path is the one page.
  location / {
    try_files $uri /index.html;
    # The tool is two people's, and it changes while they are using it. Never cache the shell.
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # The worker that removes workers (apps/field/public/sw.js), and the one route that must never
  # fall through to index.html. A browser holding a stale service worker re-fetches its script to
  # see whether it changed; that request is the only one the stale worker cannot intercept, so it
  # is the only way to reach a phone that is serving itself the wrong app from cache. Answering it
  # with the SPA fallback — as `location /` did — returns HTML where a script belongs, the update
  # is rejected as the wrong type, and the stale worker survives and asks again a second later, for
  # ever. An exact-match location keeps the fallback away from it. If the file is ever missing this
  # 404s, which is also correct: a 404 on the script makes the browser drop the registration.
  location = /sw.js {
    # Content type comes from mime.types. Never set it with add_header, which appends a second
    # Content-Type rather than replacing the first — and under nosniff a script with two content
    # types is a script the browser refuses to run.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # The menu reader's engine: a worker, a wasm core and the language data, all fetched once and
  # then wanted again on every outlet. Their names do not change between builds, so they are not
  # hashed and cannot be cached for ever — a week is long enough to make the second outlet free
  # and short enough that a new engine reaches a collector within a working week.
  location /ocr/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /assets/ {
    # Hashed filenames, so these are safe to keep for ever.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}
