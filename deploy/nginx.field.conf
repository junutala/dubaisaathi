server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # A single-page app with no service worker: every path is the one page.
  location / {
    try_files $uri /index.html;
    # The tool is two people's, and it changes while they are using it. Never cache the shell.
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    # Hashed filenames, so these are safe to keep for ever.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The camera is the whole app. Nothing else is asked for.
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
