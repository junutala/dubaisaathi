server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Railway terminates TLS at its edge and forwards the original scheme.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # The owner's page (decision 040): never cached, never indexed, never framed.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src https://pixlnjmpksmfqheotinp.supabase.co; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;
  }

  # A real file, never the fallback: a worker update check must not be answered with a page.
  location = /sw.js {
    add_header Cache-Control "no-store" always;
    add_header Content-Type "text/javascript" always;
  }
}
