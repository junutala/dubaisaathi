server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Railway terminates TLS at its edge and forwards the original scheme.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # One page. Anything else is that page too, so a shared link with a stray path still lands.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  }

  # Screenshots and fonts change name when they change; cache them for a while.
  location ~* \.(png|webp|woff2|svg)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
