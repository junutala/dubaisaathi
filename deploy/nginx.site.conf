server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Railway terminates TLS at its edge and forwards the original scheme.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # One page, and the three a payment needs: /terms, /privacy and /refund are terms.html,
  # privacy.html and refund.html, asked for without the extension (decision 048). Anything else is
  # the one page, so a shared link with a stray path still lands.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  }

  # The typefaces never change without a new name; the screenshots do, under the same names, and a visitor who
  # saw the page yesterday must see today's picture — so only the fonts are cached, and the
  # images revalidate on every load (nginx's ETag makes an unchanged one a 304, not a download).
  location ~* \.woff2$ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
