<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>Khaana 1 · story 9:16</title>
    <style>
      @font-face {
        font-family: Mukta;
        font-weight: 700;
        src: url(mukta-700.woff2) format('woff2');
      }
      @font-face {
        font-family: Mukta;
        font-weight: 600;
        src: url(mukta-600.woff2) format('woff2');
      }
      @font-face {
        font-family: Mukta;
        font-weight: 700;
        src: url(mukta-dev-700.woff2) format('woff2');
        unicode-range: U+0900-097F;
      }
      :root {
        --ink: #141826;
        --marigold: #e8871e;
        --onMarigold: #231403;
        --food: #b4610f;
        --onFood: #fff6e8;
        --teal: #0b7a6b;
        --sand: #f7f3ec;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Mukta, sans-serif;
        background: #d9c7a8;
      }
      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        background:
          url(photo.png) center 0 / 1250px auto no-repeat,
          var(--sand);
      }
      /* The problem, over the sky. */
      .problem {
        position: absolute;
        inset: 0 0 auto 0;
        padding: 250px 56px 150px;
        background: linear-gradient(
          to bottom,
          rgba(247, 243, 236, 0.94) 0%,
          rgba(247, 243, 236, 0.82) 62%,
          rgba(247, 243, 236, 0) 100%
        );
        color: var(--ink);
      }
      .problem p {
        font-weight: 700;
        font-size: 58px;
        line-height: 1.08;
        letter-spacing: -0.5px;
      }
      .problem p.last {
        color: #b3261e;
      }
      /* The answer, at the foot. */
      .answer {
        position: absolute;
        inset: auto 0 0 0;
        height: 640px;
        padding-bottom: 300px;
        padding: 40px 56px 44px;
        background: var(--food);
        color: var(--onFood);
        border-radius: 44px 44px 0 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 700;
        font-size: 44px;
        color: #fff;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      .claim {
        margin-top: 18px;
        width: 600px;
        font-weight: 600;
        font-size: 34px;
        line-height: 1.22;
      }
      .claim b {
        font-weight: 700;
        color: #fff;
      }
      .cta {
        position: absolute;
        left: 56px;
        bottom: 300px;
        display: inline-block;
        padding: 18px 30px;
        border-radius: 999px;
        background: var(--marigold);
        color: var(--onMarigold);
        font-weight: 700;
        font-size: 31px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      }
      /* The real app, offline, rising out of the band. */
      .phone {
        position: absolute;
        right: 52px;
        bottom: 290px;
        width: 330px;
        height: 600px;
        padding: 12px;
        border-radius: 52px;
        background: #111;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .phone .screen {
        width: 100%;
        height: 100%;
        border-radius: 41px;
        background:
          url(app-vrat-offline.png) center top / 100% auto no-repeat,
          #fffdf9;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="problem">
        <p>Maa ka vrat hai.</p>
        <p>Biwi ko bas veg chahiye.</p>
        <p class="last">Aur phone mein internet nahi.</p>
      </div>
      <div class="answer">
        <div class="brand"><img src="icon.png" alt="" />Dubai Saathi</div>
        <p class="claim">
          Bur Dubai ke curated Indian restaurants — <b>vrat aur veg</b>. Wahan tak ka raasta bhi.
          <b>Sab bina internet.</b>
        </p>
        <span class="cta">India mein free try karein · ₹199 se, 14 din</span>
      </div>
      <div class="phone"><div class="screen"></div></div>
    </div>
  </body>
</html>
